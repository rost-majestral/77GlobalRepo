name: Track 4 Print Metadata
run-name: This ${{ github.actor }} is starting out GitHub Actions
on: [push]
jobs:
  print-job:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print messages in PowerShell
        run: |
          Write-Output "Hello from PowerShell!"
          Write-Host "This prints to console output as well."
          echo "echo works as an alias for Write-Output in PowerShell"

      - name: Print OS runner type
        run: Write-Output "Runner OS: ${{ runner.os }}"

      - name: Print triggering event name
        run: Write-Output "Event: ${{ github.event_name }}"

      - name: Print branch name
        run: Write-Output "Branch: ${{ github.ref_name }}"

      - name: Print repository name
        run: Write-Output "Repository: ${{ github.repository }}"

      - name: List files in workspace
        run: Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse | Select-Object -ExpandProperty FullName