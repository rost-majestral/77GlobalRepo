name: Track 4 Print Metadata
run-name: This ${{ github.actor }} is starting out GitHub Actions
on: [push]
jobs:
  print-job:
    runs-on: windows-latest
    env:
      OS_TYPE: ${{ runner.os }}
      EVENT_NAME: ${{ github.event_name }}
      BRANCH_NAME: ${{ github.ref_name }}
      REPO_NAME: ${{ github.repository }}
    steps:
      - name: Print messages in PowerShell
        run: |
          Write-Output "Hello from PowerShell!"
          Write-Host "This prints to console output as well."
          echo "echo works as an alias for Write-Output in PowerShell"

      - name: Print OS runner type
        run: |
          Write-Output "Runner OS: $env:OS_TYPE"

      - name: Print triggering event name
        run: |
          Write-Output "Event: $env:EVENT_NAME"

      - name: Print branch name
        run: |
          Write-Output "Branch: $env:BRANCH_NAME"

      - name: Print repository name
        run: |
          Write-Output "Repository: $env:REPO_NAME"

      - name: Print combined metadata (interpolated)
        run: |
          Write-Output "Run by ${{ github.actor }} on $env:OS_TYPE via $env:EVENT_NAME event, branch $env:BRANCH_NAME, repo $env:REPO_NAME"

      - name: List files in workspace
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse | Select-Object -ExpandProperty FullName